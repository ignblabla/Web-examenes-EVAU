# Publica la web en GitHub Pages en cada push a main (también se puede lanzar a mano).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos push seguidos, se publica solo el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: fechasDe() (src/data/fechas.ts) saca del git log de cada MDX la
          # fecha de "Revisado el", dateModified y <lastmod>. Con el clon superficial por defecto,
          # todas las páginas tendrían la fecha del despliegue.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # La misma versión que en Cloudflare Pages y en local (Astro 5).
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
